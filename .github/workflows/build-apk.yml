
name: Construire Mali Cine APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Télécharger le projet
        uses: actions/checkout@v5

      - name: Installer Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Installer Android SDK
        uses: android-actions/setup-android@v4

      - name: Installer les composants Android
        run: |
          yes | sdkmanager --licenses
          sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Installer Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Construire Mali Ciné
        run: gradle assembleDebug

      - name: Enregistrer le fichier APK
        uses: actions/upload-artifact@v4
        with:
          name: mali-cine-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          
