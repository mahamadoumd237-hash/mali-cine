<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mali Ciné</title>
<style>
*{box-sizing:border-box}
body{
 margin:0;background:#0b0914;color:white;
 font-family:Arial,sans-serif;
}
header{
 background:#151020;padding:22px 16px;text-align:center;
 border-bottom:1px solid #302342;
}
.logo{font-size:32px;font-weight:bold;color:#a34cff}
header p{color:#ccc;margin:8px 0 0}
h2{padding:0 16px;margin-top:26px}
.search{padding:15px}
.search input{
 width:100%;padding:15px;border:0;border-radius:14px;
 background:#251d36;color:white;font-size:16px;outline:none
}
.categories{
 display:flex;gap:9px;overflow-x:auto;padding:0 15px 10px;
}
.categories button{
 border:0;border-radius:30px;padding:12px 18px;
 background:#292238;color:white;white-space:nowrap;
}
.categories button.active{background:#9946fa}
.catalogue{
 display:grid;grid-template-columns:repeat(2,minmax(0,1fr));
 gap:13px;padding:14px;
}
.card{
 background:#1b1727;border-radius:17px;overflow:hidden;
 padding:9px;
}
.poster{
 height:190px;border-radius:12px;display:flex;
 align-items:center;justify-content:center;
 text-align:center;padding:10px;font-size:40px;
 font-weight:bold;background:linear-gradient(145deg,#39226a,#171328);
}
.poster span{font-size:23px;text-shadow:0 2px 8px #000}
.info{text-align:center;padding:10px 2px}
.info h3{margin:6px 0;font-size:17px}
.info p{color:#b58be8;margin:6px 0;font-size:13px}
.watch{
 display:block;width:100%;padding:12px;border:0;border-radius:30px;
 background:#9845f6;color:white;font-size:15px;font-weight:bold;
}
.watch:active{opacity:.8}
footer{text-align:center;padding:25px;color:#888;font-size:13px}
.empty{grid-column:1/-1;text-align:center;color:#aaa;padding:30px}
</style>
</head>
<body>

<header>
 <div class="logo">🎬 MALI CINÉ</div>
 <p>Votre cinéma dans votre poche</p>
</header>

<h2>Bienvenue sur Mali Ciné</h2>

<div class="search">
 <input id="search" type="search" placeholder="🔍 Rechercher un film...">
</div>

<div class="categories" id="categories">
 <button class="active" data-category="Tous">Tous</button>
 <button data-category="Action">Action</button>
 <button data-category="Drame">Drame</button>
 <button data-category="Romance">Romance</button>
 <button data-category="Anime">Anime</button>
 <button data-category="Science-fiction">Sci-Fi</button>
 <button data-category="Série">Séries</button>
</div>

<h2>🔥 Films et séries</h2>
<div class="catalogue" id="catalogue"></div>

<footer>
 Mali Ciné · Films, séries et animés<br>
 Les boutons ouvrent les bandes-annonces disponibles sur YouTube.
</footer>

<script>
const films=[
 {title:"John Wick",cat:"Action",emoji:"🥷",color:"#4a185f"},
 {title:"Extraction",cat:"Action",emoji:"🚀",color:"#075c77"},
 {title:"The Blacklist",cat:"Série",emoji:"🤖",color:"#164d87"},
 {title:"Le dernier baobab",cat:"Drame",emoji:"🌳",color:"#17663e"},
 {title:"Avengers Endgame",cat:"Science-fiction",emoji:"🦸",color:"#783020"},
 {title:"Transformers",cat:"Science-fiction",emoji:"🤖",color:"#174b84"},
 {title:"Titanic",cat:"Romance",emoji:"🚢",color:"#173e6c"},
 {title:"Fast and Furious",cat:"Action",emoji:"🏎️",color:"#8a271c"},
 {title:"Solo Leveling",cat:"Anime",emoji:"⚔️",color:"#311c55"},
 {title:"Demon Slayer",cat:"Anime",emoji:"🔥",color:"#6b252c"},
 {title:"One Piece",cat:"Anime",emoji:"🏴‍☠️",color:"#176e91"},
 {title:"Spider-Man",cat:"Action",emoji:"🕷️",color:"#8b2027"},
 {title:"Interstellar",cat:"Science-fiction",emoji:"🌌",color:"#213858"},
 {title:"Squid Game",cat:"Série",emoji:"🎭",color:"#76204e"},
 {title:"The Walking Dead",cat:"Série",emoji:"🧟",color:"#465329"},
 {title:"Naruto",cat:"Anime",emoji:"🍥",color:"#a45619"}
];

let currentCategory="Tous";

function showFilms(){
 const query=document.getElementById("search").value.toLowerCase();
 const catalogue=document.getElementById("catalogue");
 catalogue.innerHTML="";
 const filtered=films.filter(f=>
  (currentCategory==="Tous"||f.cat===currentCategory)&&
  f.title.toLowerCase().includes(query)
 );
 if(filtered.length===0){
  catalogue.innerHTML='<div class="empty">Aucun film trouvé 😕</div>';
  return;
 }
 filtered.forEach(f=>{
  const card=document.createElement("div");
  card.className="card";
  card.innerHTML=`
   <div class="poster" style="background:linear-gradient(145deg,${f.color},#100c1c)">
    <span>${f.emoji}<br>MALI CINÉ</span>
   </div>
   <div class="info">
    <h3>${f.title}</h3>
    <p>${f.cat}</p>
    <button class="watch">▶ Bande-annonce</button>
   </div>`;
  card.querySelector(".watch").onclick=()=>{
   const url="https://www.youtube.com/results?search_query="+
    encodeURIComponent(f.title+" bande annonce français");
   window.open(url,"_blank");
  };
  catalogue.appendChild(card);
 });
}

document.getElementById("search").addEventListener("input",showFilms);

document.querySelectorAll("#categories button").forEach(button=>{
 button.onclick=()=>{
  document.querySelectorAll("#categories button").forEach(b=>b.classList.remove("active"));
  button.classList.add("active");
  currentCategory=button.dataset.category;
  showFilms();
 };
});

showFilms();
</script>
</body>
  </html>
